name: Compilar APK Veda IA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk git autoconf libtool pkg-config

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          yes y | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSES: "yes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VedaIA-APK
          path: bin/*.apk

        
